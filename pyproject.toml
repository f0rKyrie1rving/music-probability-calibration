[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-probability-calibration"
version = "0.2.0"
description = "Artist-disjoint probability-calibration experiments on frozen music-classifier scores"
requires-python = ">=3.12"
authors = [{name = "Chenglin Song"}]
dependencies = ["numpy>=2", "scipy>=1.14", "scikit-learn>=1.5", "matplotlib>=3.9", "threadpoolctl>=3"]

[tool.setuptools.packages.find]
include = ["music_calibration*"]
