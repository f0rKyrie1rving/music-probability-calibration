name: Numerical portability v2
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-runs:
    name: Six frozen plans on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install numeric dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Record numerical runtime
        run: >-
          python -c "import json, platform, sys, numpy, scipy, sklearn; from pathlib import Path; from threadpoolctl import threadpool_info; keys=('internal_api','version','threading_layer','architecture','num_threads'); Path('ci-environment.json').write_text(json.dumps({'python':sys.version.split()[0], 'system':platform.system(), 'machine':platform.machine(), 'numpy':numpy.__version__, 'scipy':scipy.__version__, 'sklearn':sklearn.__version__, 'numeric_libraries':[{k:r.get(k) for k in keys} for r in threadpool_info()]}, indent=2), encoding='utf-8')"
      - name: Unit and integrity guards
        run: python -m unittest discover -s tests -v
      - name: Reproduce and independently verify all 2160 numerical-v2 cases
        run: python scripts/reproduce_portable.py --out runs/ci_portable --report reports/ci_portable
      - name: Strictly compare all 42 numeric reports with the published v2 reference
        run: python scripts/compare_portable_runs.py --reference reports/numerical_v2 --actual reports/ci_portable --out reports/ci_portable/published_regression.json --reports-only
      - name: Add numerical runtime to the result artifact
        run: python -c "import shutil; shutil.copy2('ci-environment.json', 'reports/ci_portable/ci-environment.json')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-v2-${{ matrix.os }}
          path: |
            reports/ci_portable
          include-hidden-files: true
          if-no-files-found: warn
      - name: Preserve failed-run numerical evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-v2-failure-${{ matrix.os }}
          path: |
            runs/ci_portable/portable_freeze.json
            runs/ci_portable/children/*/freeze.json
            runs/ci_portable/children/*/verification.json
            runs/ci_portable/children/*/cases/**/calibrators.json
          if-no-files-found: warn
  compare-platforms:
    name: Compare every probability and calibration choice across all three systems
    needs: numerical-runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: numerical-v2-*
          path: comparisons
      - name: Compare Linux against the macOS v2 reference
        run: python scripts/compare_portable_runs.py --reference comparisons/numerical-v2-macos-latest --actual comparisons/numerical-v2-ubuntu-latest --out comparisons/linux_vs_macos.json
      - name: Compare Windows against the macOS v2 reference
        if: success() || failure()
        run: python scripts/compare_portable_runs.py --reference comparisons/numerical-v2-macos-latest --actual comparisons/numerical-v2-windows-latest --out comparisons/windows_vs_macos.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-v2-cross-platform-checks
          path: comparisons/*_vs_macos.json
          if-no-files-found: warn
