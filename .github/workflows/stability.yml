name: Reproduce sampling stability
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-draw-study:
    name: Five draws on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install numeric dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Record numerical runtime
        run: >-
          python -c "import json, platform, sys, numpy, scipy, sklearn; from pathlib import Path; from threadpoolctl import threadpool_info; keys=('internal_api','version','threading_layer','architecture','num_threads'); Path('ci-environment.json').write_text(json.dumps({'python':sys.version.split()[0], 'system':platform.system(), 'machine':platform.machine(), 'numpy':numpy.__version__, 'scipy':scipy.__version__, 'sklearn':sklearn.__version__, 'numeric_libraries':[{k:r.get(k) for k in keys} for r in threadpool_info()]}, indent=2), encoding='utf-8')"
      - name: Freeze, run and verify all five predefined draws
        run: python scripts/stability.py all --out runs/ci_stability --report reports/ci_stability
      - name: Independently reconstruct study aggregates
        run: python scripts/verify_stability_report.py --report reports/ci_stability --base-config protocols/budget_v1.json --manifest data/legacy_scores/manifest.json
      - name: Enumerate all platform differences (does not override the next gate)
        continue-on-error: true
        run: python scripts/audit_stability_portability.py --reference reports/stability_v1 --actual reports/ci_stability --out runs/ci_stability/portability.json
      - name: Compare sensitivity results with the published study
        run: python scripts/compare_reports.py --reference reports/stability_v1 --actual reports/ci_stability --out runs/ci_stability/regression.json --files summary.json controls.json case_metrics.csv within_split.csv summary_cells.csv ridge_selections.csv ridge_stability.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sampling-stability-reproduction-${{ matrix.os }}
          path: |
            ci-environment.json
            reports/ci_stability
            runs/ci_stability/children/*/verification.json
            runs/ci_stability/children/*/cases/**/calibrators.json
            runs/ci_stability/children/*/freeze.json
            runs/ci_stability/regression.json
            runs/ci_stability/portability.json
          if-no-files-found: warn
